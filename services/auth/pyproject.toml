[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auth-service"
version = "0.1.0"
description = "Authentication service: sign-up, email verification, sessions, password reset."
requires-python = ">=3.11"
# trading-shared is installed editable from libs/shared (see README).
dependencies = [
    "trading-shared",
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "motor==3.7.1",
    "pymongo==4.18.0",
    "bcrypt==4.1.2",
    "PyJWT==2.8.0",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==7.4.3", "pytest-asyncio==0.21.1", "httpx==0.25.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
