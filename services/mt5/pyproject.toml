[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt5-service"
version = "0.1.0"
description = "MT5 service: links the running MetaTrader 5 terminal account, syncs closed trades to the journal and serves candles."
requires-python = ">=3.11"
# trading-shared is installed editable from libs/shared (see README).
dependencies = [
    "trading-shared",
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
]

[project.optional-dependencies]
dev = ["pytest==7.4.3", "pytest-asyncio==0.21.1", "httpx==0.25.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
