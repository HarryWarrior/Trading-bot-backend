[tool.ruff]
# Target Python version
target-version = "py311"

# Line length standard
line-length = 100

# Files to exclude
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Select rules: E (pycodestyle errors), W (warnings), F (Pyflakes), I (isort), UP (pyupgrade)
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"] # Line length handled by formatter

# Allow autofix for all enabled rules (when `--fix`) is provided
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with 4 spaces
indent-style = "space"

# Format docstrings
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["app", "trading_shared", "mt5_service", "template_service", "auth_service", "journal_service", "analytics_service"]

[tool.pytest.ini_options]
# Root runs (`pytest services libs/shared/tests tests`) need async tests to run without per-service config.
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not private and not live'"
markers = [
    "private: reads real broker reports from data/private (never committed); run with -m private",
    "live: needs a running, logged-in MetaTrader 5 terminal (services/mt5); run with -m live",
]
