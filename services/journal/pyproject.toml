[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "journal-service"
version = "0.1.0"
description = "Journal service: trade import, storage and queries."
requires-python = ">=3.11"
# trading-shared is installed editable from libs/shared (see README).
dependencies = [
    "trading-shared",
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "openpyxl==3.1.2",
    "python-multipart==0.0.6",
]

[project.optional-dependencies]
dev = ["pytest==7.4.3", "pytest-asyncio==0.21.1", "httpx==0.25.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/journal_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not private'"
pythonpath = ["tests/unit"]
markers = [
    "private: reads real broker reports from data/private (never committed); run with -m private",
]
