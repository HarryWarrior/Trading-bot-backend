[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt5-bridge-service"
version = "0.1.0"
description = "MT5 EA bridge: ingest tokens, broker accounts, heartbeat and deal forwarding to journal."
requires-python = ">=3.11"
# trading-shared is installed editable from libs/shared (see README).
dependencies = [
    "trading-shared",
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "httpx==0.25.2",
]

[project.optional-dependencies]
dev = ["pytest==7.4.3", "pytest-asyncio==0.21.1", "httpx==0.25.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_bridge_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
