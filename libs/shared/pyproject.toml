[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-shared"
version = "0.1.0"
description = "Cross-cutting building blocks shared by all backend services."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "PyJWT==2.8.0",
    "motor==3.7.1",
    "pymongo==4.18.0",
]

[project.optional-dependencies]
dev = ["pytest==7.4.3", "httpx==0.25.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_shared"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
